<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Claypin — превью походки (v3, фон вырезан)</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #2b2118;
    color: #f0e6cc;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: #b8a888; font-size: 13px; margin-top: -12px; }
  .row { display: flex; gap: 40px; align-items: flex-start; }
  .panel {
    background: #1c150e;
    border: 2px solid #4a3a26;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .panel h2 { font-size: 13px; margin: 0; font-weight: 600; color: #d8c9a3; }
  .frame-box {
    width: 260px;
    height: 256px;
    background:
      linear-gradient(45deg, #3a3a3a 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(-45deg, #3a3a3a 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(45deg, transparent 75%, #3a3a3a 75%) -8px 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, #3a3a3a 75%) -8px 0/16px 16px,
      #2b2b2b;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: auto;
  }
  .mirrored img { transform: scaleX(-1); }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.06);
    padding: 10px 18px;
    border-radius: 10px;
  }
  .controls label { font-size: 13px; }
  .controls input[type=range] { width: 180px; }
  .controls button {
    background: #e0a83f;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .filmstrip {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    max-width: 900px;
    justify-content: center;
  }
  .filmstrip img {
    width: 84px;
    height: 84px;
    object-fit: contain;
    background:
      linear-gradient(45deg, #3a3a3a 25%, transparent 25%) -6px 0/12px 12px,
      linear-gradient(-45deg, #3a3a3a 25%, transparent 25%) -6px 0/12px 12px,
      linear-gradient(45deg, transparent 75%, #3a3a3a 75%) -6px 0/12px 12px,
      linear-gradient(-45deg, transparent 75%, #3a3a3a 75%) -6px 0/12px 12px,
      #2b2b2b;
    border-radius: 4px;
    border: 2px solid #4a3a26;
    opacity: 0.65;
  }
  .filmstrip img.active {
    border-color: #e0a83f;
    opacity: 1;
  }
  .filmstrip .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .filmstrip .idx { font-size: 11px; color: #9c8b6a; }
</style>
</head>
<body>
  <h1>Клэйпин — превью цикла ходьбы (v3, 8 кадров, фон вырезан chroma-key)</h1>
  <div class="sub">Финальные прозрачные кадры — те же, что уже подключены в игре (12 fps)</div>

  <div class="controls">
    <button id="playBtn">⏸ пауза</button>
    <label>Скорость: <span id="fpsLabel">12</span> fps</label>
    <input type="range" id="fpsSlider" min="2" max="16" value="12" step="1" />
  </div>

  <div class="row">
    <div class="panel">
      <h2>Как есть</h2>
      <div class="frame-box"><img id="imgLeft" src="assets/source/walk_1.png" /></div>
    </div>
    <div class="panel">
      <h2>Зеркально (для ходьбы в другую сторону)</h2>
      <div class="frame-box mirrored"><img id="imgRight" src="assets/source/walk_1.png" /></div>
    </div>
  </div>

  <div class="filmstrip" id="filmstrip"></div>

  <script>
    const FRAME_COUNT = 8;
    const frames = Array.from({ length: FRAME_COUNT }, (_, i) => `assets/source/walk_${i + 1}.png`);

    const imgLeft = document.getElementById('imgLeft');
    const imgRight = document.getElementById('imgRight');
    const filmstrip = document.getElementById('filmstrip');
    const playBtn = document.getElementById('playBtn');
    const fpsSlider = document.getElementById('fpsSlider');
    const fpsLabel = document.getElementById('fpsLabel');

    frames.forEach((src, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const img = document.createElement('img');
      img.src = src;
      img.dataset.index = i;
      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = i + 1;
      cell.appendChild(img);
      cell.appendChild(idx);
      filmstrip.appendChild(cell);
    });

    let current = 0;
    let playing = true;
    let fps = 12;
    let acc = 0;
    let lastTime = performance.now();

    function render() {
      imgLeft.src = frames[current];
      imgRight.src = frames[current];
      [...filmstrip.querySelectorAll('img')].forEach((img, i) => {
        img.classList.toggle('active', i === current);
      });
    }
    render();

    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      if (playing) {
        acc += dt;
        const frameTime = 1 / fps;
        while (acc >= frameTime) {
          acc -= frameTime;
          current = (current + 1) % FRAME_COUNT;
        }
        render();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    playBtn.onclick = () => {
      playing = !playing;
      playBtn.textContent = playing ? '⏸ пауза' : '▶ играть';
    };
    fpsSlider.oninput = () => {
      fps = Number(fpsSlider.value);
      fpsLabel.textContent = fps;
    };
    filmstrip.addEventListener('click', (e) => {
      const img = e.target.closest('img');
      if (!img) return;
      current = Number(img.dataset.index);
      render();
    });
  </script>
</body>
</html>
